services:
  db:
    image: mysql:8.0
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    container_name: blood_system_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blood_system
      MYSQL_USER: flaskuser
      MYSQL_PASSWORD: FlaskPass123!
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db_init.sql:/docker-entrypoint-initdb.d/db_init.sql:ro
    # Do not expose MySQL to the host to avoid host port conflicts.
    # Other containers (the `web` service) will reach it via the service name `db`.

  web:
    build: .
    container_name: blood_system_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    
    environment:
      DB_HOST: db
      DB_USER: flaskuser
      DB_PASSWORD: FlaskPass123!
      DB_NAME: blood_system
      SECRET_KEY: BloodSystemSecret2026

    ports:
      - "5004:5000"
    volumes:
      - ./:/app:cached

volumes:
  mysql_data:
    driver: local
