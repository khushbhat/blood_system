{% extends "layout.html" %}
{% block title %}Log a Donation{% endblock %}
{% block content %}
<h2 class="mb-4">Log a New Donation</h2>
<form method="post">
  <div class="mb-3">
    <label for="hospital_id" class="form-label">Hospital</label>
    <select id="hospital_id" name="hospital_id" class="form-select" required>
      <option value="">Select…</option>
      {% for h in hospitals %}
        <option value="{{ h.hospital_id }}">{{ h.hospital_name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="mb-3">
    <label for="donation_date" class="form-label">Date</label>
    <input type="date" id="donation_date" name="donation_date" class="form-control" required>
  </div>
  <div class="mb-3">
    <label for="units_donated" class="form-label">Units Donated</label>
    <input type="number" id="units_donated" name="units_donated" class="form-control" min="1" required>
  </div>
  <button type="submit" class="btn btn-success">Submit Donation</button>
</form>
{% endblock %}
