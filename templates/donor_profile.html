{% extends "layout.html" %}
{% block title %}Donor Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Complete Your Donor Profile</h2>
    <form method="post" action="{{ url_for('donor_profile') }}">
      <div class="mb-3">
        <label for="blood_group" class="form-label">Blood Group</label>
        <select id="blood_group" name="blood_group" class="form-select" required>
          <option value="">Choose…</option>
          <option>O+</option><option>O-</option>
          <option>A+</option><option>A-</option>
          <option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option>
        </select>
      </div>
      <div class="mb-3">
        <label for="city" class="form-label">City</label>
        <input type="text" id="city" name="city" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="last_donation_date" class="form-label">Last Donation Date</label>
        <input type="date" id="last_donation_date" name="last_donation_date" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Save Profile</button>
    </form>
  </div>
</div>
{% endblock %}
